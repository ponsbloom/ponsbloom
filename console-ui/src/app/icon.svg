<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8DDD5"/>
      <stop offset="50%" stop-color="#A8C5B5"/>
      <stop offset="100%" stop-color="#7BA89A"/>
