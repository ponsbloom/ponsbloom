  <!-- Edge strokes -->
  <rect x="7" y="7" width="17" height="50" rx="5" fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="1"/>
  <rect x="7" y="7" width="40" height="17" rx="5" fill="none" stroke="rgba(255,255,255,0.60)" stroke-width="1"/>
  <rect x="24" y="30" width="23" height="14" rx="5" fill="none" stroke="rgba(255,255,255,0.50)" stroke-width="1"/>
  <rect x="47" y="7" width="10" height="23" rx="5" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1"/>
