  </defs>
  <!-- P-block letter -->
  <rect x="7" y="7" width="17" height="50" rx="5" fill="url(#gb)"/>
  <rect x="7" y="7" width="40" height="17" rx="5" fill="url(#gb)"/>
  <rect x="24" y="30" width="23" height="14" rx="5" fill="url(#gb)"/>
